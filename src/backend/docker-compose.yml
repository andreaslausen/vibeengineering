services:
  api:
    build:
      context: .
      dockerfile: Zeiterfassung.API/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Database=zeiterfassung;Username=postgres;Password=postgres
      - Jwt__SecretKey=dev-super-secret-key-must-be-at-least-32-characters-long-for-hs256
      - Jwt__Issuer=zeiterfassung-api
      - Jwt__Audience=zeiterfassung-clients
      - Jwt__AccessTokenExpirationMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
    depends_on:
      - db
    networks:
      - backend
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: zeiterfassung
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
volumes:
  db_data:
networks:
  backend:
    driver: bridge
